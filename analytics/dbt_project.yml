# name of the project
name: analytics
version: '1.0.0'

# this setting configures which "profile" dbt uses for this project
profile: analytics

seed-paths: ["seeds"]
model-paths: ["models"]
macro-paths: ["macros"]
clean-targets:
  - "target"
  - "dbt_packages"
flags:
  require_generic_test_arguments_property: true

# table or view materializations are the default, but you can override this for specific models

models:
  analytics:
    +materialized: table 